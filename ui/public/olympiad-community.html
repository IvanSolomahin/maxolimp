<!doctype html>
<html lang="ru">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Сообщества</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <link rel="stylesheet" href="./olympiad-community.css" />
    <link rel="stylesheet" href="./olympiad-layout.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body class="app-shell">
    <olympiad-header active="communities" title="Сообщества"></olympiad-header>
    <main class="content app-main">
      <div class="intro">
        <h1>Найдите единомышленников</h1>
        <p>
          Онлайн-чаты для вопросов и разбора задач или очные кружки рядом с
          вами.
        </p>
      </div>

      <div
        class="segment"
        role="group"
        aria-label="Формат сообществ"
        id="mode-toggle"
      >
        <button type="button" data-mode="online" aria-pressed="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18Z"></path>
          </svg>
          Онлайн
        </button>
        <button type="button" data-mode="offline" aria-pressed="false">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s7-6.5 7-11.5a7 7 0 1 0-14 0C5 14.5 12 21 12 21Z"
            ></path>
            <circle cx="12" cy="9.5" r="2.3"></circle>
          </svg>
          Офлайн
        </button>
      </div>

      <section id="online-view">
        <label class="filter-field">
          Предмет
          <select id="online-subject"><option value="">Все предметы</option></select>
        </label>
        <div class="cards" id="online-list"></div>
      </section>

      <section id="offline-view" hidden>
        <div class="filter-row">
          <label class="filter-field">
            Предмет
            <select id="club-subject"><option value="">Все предметы</option></select>
          </label>
          <label class="filter-field">
            Город
            <select id="club-city"><option value="Санкт-Петербург">Санкт-Петербург</option></select>
          </label>
        </div>
        <div id="community-map" class="community-map" aria-label="Карта кружков Санкт-Петербурга"></div>
        <div id="community-message" class="community-message" role="status"></div>
        <div class="community-results-head">
          <p class="section-label">Кружки в Санкт-Петербурге</p>
          <button id="nearby-button" class="detail-link" type="button">Рядом со мной</button>
        </div>
        <div class="club-list" id="club-list"></div>
      </section>
    </main>

    <olympiad-nav active="communities"></olympiad-nav>

    <dialog id="club-dialog">
      <div class="sheet">
        <div class="sheet-head">
          <div>
            <h2 id="sheet-title"></h2>
            <p class="sheet-sub" id="sheet-sub"></p>
          </div>
          <button
            class="icon-btn"
            id="close-dialog"
            type="button"
            aria-label="Закрыть"
          >
            <svg viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18"></path>
            </svg>
          </button>
        </div>
        <ul class="sheet-facts" id="sheet-facts"></ul>
        <div class="sheet-actions">
          <button
            class="join-btn"
            type="button"
            style="width: 100%; justify-content: center; min-height: 48px"
          >
            Записаться
          </button>
        </div>
      </div>
    </dialog>

    <script src="./olympiad-shell.js"></script>
    <script src="./max-init.js"></script>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./olympiad-community.js"></script>
  </body>
</html>
