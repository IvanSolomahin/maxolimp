<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Поиск олимпиадных задач</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <link rel="stylesheet" href="./olympiad-task-search.css" />
    <link rel="stylesheet" href="./olympiad-layout.css" />
  </head>
  <body class="app-shell">
    <olympiad-header
      active="tasks"
      title="Олимпиадные задачи"
    ></olympiad-header>

    <main class="app-main" id="content">
      <section class="section" data-od-id="task-search-screen">
        <div class="container">
          <label
            class="subject-switch"
            for="subject-select"
            data-od-id="subject-switch"
          >
            <span class="subject-label">Предмет</span>
            <select
              class="subject-select"
              id="subject-select"
              aria-label="Выбранный предмет"
              data-od-id="subject-select"
            >
              <option value="math">Математика</option>
              <option value="physics">Физика</option>
            </select>
          </label>

          <div class="search-field" data-od-id="search-field">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <label class="visually-hidden" for="task-query"
              >Поиск по задачам</label
            >
            <input
              class="search-input"
              id="task-query"
              type="search"
              autocomplete="off"
              placeholder="Например, инвариант или закон Ома"
              data-od-id="search-input"
            />
            <button
              class="icon-btn clear-search"
              type="button"
              aria-label="Очистить поиск"
              data-od-id="clear-search"
              hidden=""
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="m7 7 10 10M17 7 7 17"></path>
              </svg>
            </button>
          </div>

          <div class="toolbar" data-od-id="search-toolbar">
            <button
              class="control-btn"
              type="button"
              data-od-id="open-filters"
              aria-haspopup="dialog"
              aria-controls="filter-dialog"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M4 7h16M7 12h10M10 17h4"></path>
              </svg>
              <span>Фильтры</span>
              <span class="count-badge" id="filter-count" hidden="">0</span>
            </button>
            <div class="sort-wrap">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M8 6h12M8 12h8M8 18h4M4 5v14"></path>
              </svg>
              <label class="visually-hidden" for="sort-select"
                >Сортировка</label
              >
              <select
                class="sort-select"
                id="sort-select"
                data-od-id="sort-select"
              >
                <option value="relevance">По релевантности</option>
                <option value="newest">Сначала новые</option>
                <option value="difficulty">По сложности</option>
              </select>
            </div>
          </div>

          <div
            class="active-filters"
            id="active-filters"
            data-od-id="active-filters"
            aria-label="Активные фильтры"
            hidden=""
          ></div>

          <div class="results-head">
            <h2
              class="visually-hidden"
              id="results-heading"
              data-od-id="results-heading"
            >
              Результаты
            </h2>
            <span class="results-count" id="results-count" aria-live="polite"
              >0 заданий</span
            >
          </div>

          <div
            class="task-list"
            id="task-list"
            data-od-id="task-list"
            aria-labelledby="results-heading"
          ></div>
          <button class="btn btn-secondary" id="load-more" type="button" hidden>
            Показать ещё
          </button>
          <div
            class="empty-state"
            id="empty-state"
            data-od-id="empty-state"
            role="status"
            hidden=""
          >
            <h3 id="empty-title">Ничего не найдено</h3>
            <p id="empty-copy">
              Попробуйте другой запрос или уберите часть фильтров.
            </p>
            <button
              class="text-btn"
              id="empty-action"
              type="button"
              data-od-id="reset-search"
            >
              Сбросить поиск
            </button>
          </div>
        </div>
      </section>
    </main>

    <dialog
      id="filter-dialog"
      aria-labelledby="filter-title"
      data-od-id="filter-dialog"
    >
      <div class="sheet-head">
        <h2 id="filter-title">Фильтры</h2>
        <button
          class="icon-btn"
          type="button"
          aria-label="Закрыть фильтры"
          data-od-id="close-filters"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
      </div>
      <div class="sheet-body">
        <div class="filter-group">
          <h3>Олимпиада</h3>
          <div class="olympiad-picker">
            <input
              class="filter-select"
              id="olympiad-search"
              type="search"
              autocomplete="off"
              placeholder="Поиск по названию"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="olympiad-options"
              aria-expanded="false"
            />
            <div
              class="olympiad-options"
              id="olympiad-options"
              role="listbox"
              aria-label="Олимпиады"
              hidden
            ></div>
            <div class="olympiad-selection" id="olympiad-selection" hidden>
              <span
                class="olympiad-selection-name"
                id="olympiad-selection-name"
              ></span>
              <button
                class="olympiad-selection-clear"
                id="clear-olympiad"
                type="button"
                aria-label="Убрать выбранную олимпиаду"
              >
                ×
              </button>
            </div>
          </div>
        </div>
        <div class="filter-group">
          <h3>Сложность</h3>
          <div class="filter-selects">
            <label class="select-field" for="difficulty-min"
              ><span>От</span
              ><input
                class="filter-select"
                id="difficulty-min"
                type="number"
                min="1"
                max="10"
                placeholder="1"
            /></label>
            <label class="select-field" for="difficulty-max"
              ><span>До</span
              ><input
                class="filter-select"
                id="difficulty-max"
                type="number"
                min="1"
                max="10"
                placeholder="10"
            /></label>
          </div>
        </div>
        <div class="filter-group">
          <h3>Класс</h3>
          <select class="filter-select" id="grade-filter">
            <option value="">Все классы</option>
            <option value="8">8 класс</option>
            <option value="9">9 класс</option>
            <option value="10">10 класс</option>
            <option value="11">11 класс</option>
          </select>
        </div>
      </div>
      <div class="sheet-actions">
        <button
          class="btn btn-secondary"
          type="button"
          data-od-id="reset-filters"
        >
          Сбросить
        </button>
        <button
          class="btn btn-primary"
          type="button"
          data-od-id="apply-filters"
        >
          Показать задачи
        </button>
      </div>
    </dialog>

    <main class="task-page app-main" id="task-page" hidden>
      <div class="task-page-inner">
        <button class="task-back" type="button" id="task-back">
          <span aria-hidden="true">←</span> К результатам поиска
        </button>
        <article class="task-detail-card">
          <p class="task-page-meta" id="detail-meta"></p>
          <h1 class="task-page-title" id="detail-title">Загрузка задачи…</h1>
          <p class="task-detail-label">Условие</p>
          <p
            class="task-statement task-loading"
            id="detail-statement"
            aria-live="polite"
          ></p>
          <a
            class="task-source"
            id="detail-source"
            target="_blank"
            rel="noopener noreferrer"
            hidden
            >Открыть источник ↗</a
          >
        </article>
        <section class="task-solution" id="detail-answer-form">
          <label for="detail-user-answer">Ваш ответ</label>
          <div class="detail-answer-row">
            <input id="detail-user-answer" type="text" autocomplete="off" placeholder="Введите ответ" />
            <button id="detail-submit-answer" type="button">Отправить</button>
          </div>
          <p id="detail-feedback" role="status" hidden></p>
        </section>
        <section
          class="task-solution"
          id="detail-solution-section"
          aria-labelledby="detail-solution-title"
          hidden
        >
          <h2 id="detail-solution-title">Решение</h2>
          <p class="task-answer" id="detail-answer" hidden>
            <span>Ответ</span><b id="detail-answer-text"></b>
          </p>
          <p
            class="task-solution-text"
            id="detail-solution"
            aria-live="polite"
          ></p>
          <button id="detail-mark-solved" type="button">Отметить решённой</button>
        </section>
      </div>
    </main>

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      hidden=""
    ></div>

    <olympiad-nav active="tasks"></olympiad-nav>
    <script src="./olympiad-shell.js"></script>
    <script src="./max-init.js"></script>

    <script src="./math-render.js" defer></script>
    <script src="./task-search.js" defer></script>
  </body>
</html>
