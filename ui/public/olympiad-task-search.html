<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Поиск олимпиадных задач</title>

    <script src="https://st.max.ru/js/max-web-app.js"></script>

    <link rel="stylesheet" href="/olympiad-task-search.css" />
    <link rel="stylesheet" href="/olympiad-layout.css" />

    <style>
      /* =========================
         MAX
         ========================= */

      .task-share-max {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        padding: 12px 24px;
        border: 0;
        border-radius: 50px;
        background: linear-gradient(135deg, #667eea 0%, #334bb7 100%);
        color: #fff;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        transition:
          transform 0.3s ease,
          box-shadow 0.3s ease;
      }

      .task-share-max:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
      }

      .task-share-max:active {
        transform: translateY(0);
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      }

      .task-share-max:focus-visible {
        outline: 3px solid rgba(102, 126, 234, 0.35);
        outline-offset: 3px;
      }

      .task-share-max svg {
        width: 24px;
        height: 24px;
        flex: 0 0 24px;
      }

      @media (max-width: 700px) {
        .task-share-max {
          width: 100%;
        }
      }

      /* =========================
         ПРОВЕРКА РЕШЕНИЯ
         ========================= */

      #detail-check-solution {
        margin-top: 24px;
      }

      #detail-check-solution h2 {
        margin: 0 0 8px;
      }

      .solution-upload {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 16px;
      }

      .solution-file-wrap {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px dashed #cfd4dc;
        border-radius: 14px;
        background: #fafbfc;
      }

      #solution-file {
        width: 100%;
        max-width: 100%;
        font: inherit;
        color: #20242a;
      }

      #solution-file::file-selector-button {
        margin-right: 12px;
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        background: #eef1f5;
        color: #111827;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      #solution-file::file-selector-button:hover {
        background: #e4e8ee;
      }

      #detail-check-solution-button {
        align-self: flex-start;
        padding: 12px 20px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      #detail-check-solution-button:hover:not(:disabled) {
        transform: translateY(-1px);
        opacity: 0.92;
      }

      #detail-check-solution-button:active:not(:disabled) {
        transform: translateY(0);
      }

      #detail-check-solution-button:disabled {
        opacity: 0.55;
        cursor: default;
      }

      #solution-check-status {
        margin: 14px 0 0;
        font-size: 14px;
        color: #667085;
      }

      #solution-check-result {
        margin-top: 18px;
        padding: 22px;
        border: 1px solid #e3e7ec;
        border-radius: 16px;
        background: #fff;
        color: #20242a;
        font-size: 15px;
        line-height: 1.65;
        overflow-wrap: anywhere;
      }

      #solution-check-result h2 {
        margin: 0 0 14px;
        font-size: 20px;
        line-height: 1.35;
      }

      #solution-check-result h3 {
        margin: 20px 0 8px;
        font-size: 16px;
        line-height: 1.4;
      }

      #solution-check-result p {
        margin: 10px 0;
      }

      #solution-check-result strong {
        font-weight: 700;
      }

      #solution-check-result .check-verdict {
        display: inline-flex;
        align-items: center;
        margin-bottom: 14px;
        padding: 7px 11px;
        border-radius: 999px;
        background: #f0f2f5;
        font-size: 14px;
        font-weight: 700;
      }

      #solution-check-result .check-section {
        margin-top: 18px;
      }

      @media (max-width: 700px) {
        .solution-file-wrap {
          align-items: stretch;
          flex-direction: column;
        }

        #detail-check-solution-button {
          width: 100%;
        }

        #solution-check-result {
          padding: 16px;
        }
      }
    </style>
  </head>

  <body class="app-shell">
    <olympiad-header
      active="tasks"
      title="Олимпиадные задачи"
    ></olympiad-header>

    <main class="app-main" id="content">
      <section class="section" data-od-id="task-search-screen">
        <div class="container">

          <label
            class="subject-switch"
            for="subject-select"
            data-od-id="subject-switch"
          >
            <span class="subject-label">Предмет</span>

            <select
              class="subject-select"
              id="subject-select"
              aria-label="Выбранный предмет"
              data-od-id="subject-select"
            >
              <option value="math">Математика</option>
              <option value="physics">Физика</option>
            </select>
          </label>

          <div class="search-field" data-od-id="search-field">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>

            <label
              class="visually-hidden"
              for="task-query"
            >
              Поиск по задачам
            </label>

            <input
              class="search-input"
              id="task-query"
              type="search"
              autocomplete="off"
              placeholder="Например, инвариант или закон Ома"
              data-od-id="search-input"
            />

            <button
              class="icon-btn clear-search"
              type="button"
              aria-label="Очистить поиск"
              data-od-id="clear-search"
              hidden
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="m7 7 10 10M17 7 7 17"></path>
              </svg>
            </button>
          </div>

          <div
            class="toolbar"
            data-od-id="search-toolbar"
          >
            <button
              class="control-btn"
              type="button"
              data-od-id="open-filters"
              aria-haspopup="dialog"
              aria-controls="filter-dialog"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M4 7h16M7 12h10M10 17h4"></path>
              </svg>

              <span>Фильтры</span>

              <span
                class="count-badge"
                id="filter-count"
                hidden
              >
                0
              </span>
            </button>

            <div class="sort-wrap">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                aria-hidden="true"
              >
                <path d="M8 6h12M8 12h8M8 18h4M4 5v14"></path>
              </svg>

              <label
                class="visually-hidden"
                for="sort-select"
              >
                Сортировка
              </label>

              <select
                class="sort-select"
                id="sort-select"
                data-od-id="sort-select"
              >
                <option value="relevance">
                  По релевантности
                </option>
                <option value="newest">
                  Сначала новые
                </option>
                <option value="difficulty">
                  По сложности
                </option>
              </select>
            </div>
          </div>

          <div
            class="active-filters"
            id="active-filters"
            data-od-id="active-filters"
            aria-label="Активные фильтры"
            hidden
          ></div>

          <div class="results-head">
            <h2
              class="visually-hidden"
              id="results-heading"
              data-od-id="results-heading"
            >
              Результаты
            </h2>

            <span
              class="results-count"
              id="results-count"
              aria-live="polite"
            >
              0 заданий
            </span>
          </div>

          <div
            class="task-list"
            id="task-list"
            data-od-id="task-list"
            aria-labelledby="results-heading"
          ></div>

          <button
            class="btn btn-secondary"
            id="load-more"
            type="button"
            hidden
          >
            Показать ещё
          </button>

          <div
            class="empty-state"
            id="empty-state"
            data-od-id="empty-state"
            role="status"
            hidden
          >
            <h3 id="empty-title">
              Ничего не найдено
            </h3>

            <p id="empty-copy">
              Попробуйте другой запрос или уберите часть фильтров.
            </p>

            <button
              class="text-btn"
              id="empty-action"
              type="button"
              data-od-id="reset-search"
            >
              Сбросить поиск
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- ФИЛЬТРЫ -->

    <dialog
      id="filter-dialog"
      aria-labelledby="filter-title"
      data-od-id="filter-dialog"
    >
      <div class="sheet-head">
        <h2 id="filter-title">
          Фильтры
        </h2>

        <button
          class="icon-btn"
          type="button"
          aria-label="Закрыть фильтры"
          data-od-id="close-filters"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            aria-hidden="true"
          >
            <path d="m7 7 10 10M17 7 7 17"></path>
          </svg>
        </button>
      </div>

      <div class="sheet-body">

        <div class="filter-group">
          <h3 id="classifier-title">
            Теги классификатора
          </h3>

          <input
            class="filter-select"
            id="classifier-search"
            type="search"
            autocomplete="off"
            placeholder="Найти тег"
            aria-label="Поиск по тегам классификатора"
          />

          <div
            class="classifier-options"
            id="classifier-options"
            role="group"
            aria-labelledby="classifier-title"
          ></div>
        </div>

        <div class="filter-group">
          <h3>
            Олимпиада
          </h3>

          <div class="olympiad-picker">

            <input
              class="filter-select"
              id="olympiad-search"
              type="search"
              autocomplete="off"
              placeholder="Поиск по названию"
              role="combobox"
              aria-autocomplete="list"
              aria-controls="olympiad-options"
              aria-expanded="false"
            />

            <div
              class="olympiad-options"
              id="olympiad-options"
              role="listbox"
              aria-label="Олимпиады"
              hidden
            ></div>

            <div
              class="olympiad-selection"
              id="olympiad-selection"
              hidden
            >
              <span
                class="olympiad-selection-name"
                id="olympiad-selection-name"
              ></span>

              <button
                class="olympiad-selection-clear"
                id="clear-olympiad"
                type="button"
                aria-label="Убрать выбранную олимпиаду"
              >
                ×
              </button>
            </div>

          </div>
        </div>

        <div class="filter-group">
          <h3>
            Сложность
          </h3>

          <div class="filter-selects">

            <label
              class="select-field"
              for="difficulty-min"
            >
              <span>От</span>

              <input
                class="filter-select"
                id="difficulty-min"
                type="number"
                min="1"
                max="10"
                placeholder="1"
              />
            </label>

            <label
              class="select-field"
              for="difficulty-max"
            >
              <span>До</span>

              <input
                class="filter-select"
                id="difficulty-max"
                type="number"
                min="1"
                max="10"
                placeholder="10"
              />
            </label>

          </div>
        </div>

        <div class="filter-group">
          <h3>
            Класс
          </h3>

          <select
            class="filter-select"
            id="grade-filter"
          >
            <option value="">
              Все классы
            </option>
            <option value="8">
              8 класс
            </option>
            <option value="9">
              9 класс
            </option>
            <option value="10">
              10 класс
            </option>
            <option value="11">
              11 класс
            </option>
          </select>
        </div>

      </div>

      <div class="sheet-actions">

        <button
          class="btn btn-secondary"
          type="button"
          data-od-id="reset-filters"
        >
          Сбросить
        </button>

        <button
          class="btn btn-primary"
          type="button"
          data-od-id="apply-filters"
        >
          Показать задачи
        </button>

      </div>
    </dialog>

    <!-- СТРАНИЦА ЗАДАЧИ -->

    <main
      class="task-page app-main"
      id="task-page"
      hidden
    >
      <div class="task-page-inner">

        <button
          class="task-back"
          type="button"
          id="task-back"
        >
          <span aria-hidden="true">
            ←
          </span>
          К результатам поиска
        </button>

        <!-- УСЛОВИЕ ЗАДАЧИ -->

        <article class="task-detail-card">

          <p
            class="task-page-meta"
            id="detail-meta"
          ></p>

          <h1
            class="task-page-title"
            id="detail-title"
          >
            Загрузка задачи…
          </h1>

          <p class="task-detail-label">
            Условие
          </p>

          <p
            class="task-statement task-loading"
            id="detail-statement"
            aria-live="polite"
          ></p>

          <a
            class="task-source"
            id="detail-source"
            target="_blank"
            rel="noopener noreferrer"
            hidden
          >
            Открыть источник ↗
          </a>

          <!-- MAX -->

          <button
            class="task-share-max"
            id="task-share-max"
            type="button"
            aria-label="Поделиться задачей в MAX"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 1000 1000"
              aria-hidden="true"
            >
              <defs>

                <linearGradient id="max-gradient-1">
                  <stop
                    offset="0"
                    stop-color="#00f"
                  />
                  <stop
                    offset="1"
                    stop-opacity="0"
                  />
                </linearGradient>

                <linearGradient id="max-gradient-2">
                  <stop
                    offset="0"
                    stop-color="#4cf"
                  />
                  <stop
                    offset=".662"
                    stop-color="#53e"
                  />
                  <stop
                    offset="1"
                    stop-color="#93d"
                  />
                </linearGradient>

                <linearGradient
                  id="max-gradient-3"
                  x1="117.847"
                  x2="1000"
                  y1="760.536"
                  y2="500"
                  gradientUnits="userSpaceOnUse"
                  href="#max-gradient-2"
                />

                <radialGradient
                  id="max-gradient-4"
                  cx="-87.392"
                  cy="1166.116"
                  r="500"
                  fx="-87.392"
                  fy="1166.116"
                  gradientTransform="rotate(51.356 1551.478 559.3) scale(2.42703433 1)"
                  gradientUnits="userSpaceOnUse"
                  href="#max-gradient-1"
                />
              </defs>

              <rect
                width="1000"
                height="1000"
                fill="url(#max-gradient-3)"
                ry="249.681"
              />

              <rect
                width="1000"
                height="1000"
                fill="url(#max-gradient-4)"
                ry="249.681"
              />

              <path
                fill="#fff"
                fill-rule="evenodd"
                d="M508.211 878.328c-75.007 0-109.864-10.95-170.453-54.75-38.325 49.275-159.686 87.783-164.979 21.9 0-49.456-10.95-91.248-23.36-136.873-14.782-56.21-31.572-118.807-31.572-209.508 0-216.626 177.754-379.597 388.357-379.597 210.785 0 375.947 171.001 375.947 381.604.707 207.346-166.595 376.118-373.94 377.224m3.103-571.585c-102.564-5.292-182.499 65.7-200.201 177.024-14.6 92.162 11.315 204.398 33.397 210.238 10.585 2.555 37.23-18.98 53.837-35.587a189.8 189.8 0 0 0 92.71 33.032c106.273 5.112 197.08-75.794 204.215-181.95 4.154-106.382-77.67-196.486-183.958-202.574Z"
                clip-rule="evenodd"
              />
            </svg>

            <span>
              Поделиться в MAX
            </span>
          </button>

        </article>

        <!-- ОТВЕТ ПОЛЬЗОВАТЕЛЯ -->

        <section
          class="task-solution"
          id="detail-answer-form"
        >

          <label for="detail-user-answer">
            Ваш ответ
          </label>

          <div class="detail-answer-row">

            <input
              id="detail-user-answer"
              type="text"
              autocomplete="off"
              placeholder="Введите ответ"
            />

            <button
              id="detail-submit-answer"
              type="button"
            >
              Отправить
            </button>

          </div>

          <p
            id="detail-feedback"
            role="status"
            hidden
          ></p>

        </section>

        <!-- ПРОВЕРКА РЕШЕНИЯ -->

        <section
          class="task-solution"
          id="detail-check-solution"
        >

          <h2>
            Проверка решения
          </h2>

          <div class="solution-upload">

            <div class="solution-file-wrap">

              <input
                id="solution-file"
                type="file"
                accept=".jpg,.jpeg,.png,.webp,.pdf"
              />

            </div>

            <button
              id="detail-check-solution-button"
              type="button"
            >
              Отправить на проверку
            </button>

          </div>

          <p
            id="solution-check-status"
            role="status"
            hidden
          ></p>

          <div
            id="solution-check-result"
            hidden
          ></div>

        </section>

        <!-- ГОТОВОЕ РЕШЕНИЕ -->

        <section
          class="task-solution"
          id="detail-solution-section"
          aria-labelledby="detail-solution-title"
          hidden
        >

          <h2 id="detail-solution-title">
            Решение
          </h2>

          <p
            class="task-answer"
            id="detail-answer"
            hidden
          >
            <span>
              Ответ
            </span>

            <b id="detail-answer-text"></b>
          </p>

          <p
            class="task-solution-text"
            id="detail-solution"
            aria-live="polite"
          ></p>

        </section>

      </div>
    </main>

    <div
      class="toast"
      id="toast"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <olympiad-nav active="tasks"></olympiad-nav>

    <script src="/olympiad-shell.js"></script>
    <script src="/max-init.js"></script>

    <script
      src="/math-render.js"
      defer
    ></script>

    <script
      src="/answer-viewport.js"
      defer
    ></script>

    <script
      src="/task-search.js"
      defer
    ></script>
  </body>
</html>
