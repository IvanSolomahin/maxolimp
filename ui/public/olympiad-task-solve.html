<!doctype html>
<html lang="ru">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Тренажёр</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <link rel="stylesheet" href="./olympiad-task-solve.css" />
    <link rel="stylesheet" href="./olympiad-flow.css" />
  </head>
  <body class="flow-shell">
    <div class="stage">
      <div class="caption"><strong>Олимпиады</strong> · тренажёр</div>
      <div class="device">
        <span class="island" aria-hidden="true"></span>
        <div class="screen">
          <olympiad-header active="tasks"></olympiad-header>
          <div class="statusbar">
            <span class="num">9:41</span>
            <span class="statusbar-right">
              <svg viewBox="0 0 17 11" aria-hidden="true">
                <rect x="0" y="7" width="3" height="4" rx=".6"></rect>
                <rect x="4" y="5" width="3" height="6" rx=".6"></rect>
                <rect x="8" y="3" width="3" height="8" rx=".6"></rect>
                <rect x="12" y="0" width="3" height="11" rx=".6"></rect>
              </svg>
              <svg viewBox="0 0 17 11" aria-hidden="true">
                <path
                  d="M8.5 1.5c-3 0-5.8 1.1-8 3.1L2 6.1a9.8 9.8 0 0 1 13 0l1.5-1.5a11.8 11.8 0 0 0-8-3.1ZM3.5 7.6 5 9.1a5.2 5.2 0 0 1 7 0l1.5-1.5a7.4 7.4 0 0 0-10 0Zm3 3 2 2 2-2a2.8 2.8 0 0 0-4 0Z"
                ></path>
              </svg>
              <svg class="battery" viewBox="0 0 25 11" aria-hidden="true">
                <rect
                  x=".5"
                  y=".5"
                  width="21"
                  height="10"
                  rx="2.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-opacity=".45"
                ></rect>
                <rect x="22" y="3.5" width="1.5" height="4" rx=".4"></rect>
                <rect x="2" y="2" width="18" height="7" rx="1.4"></rect>
              </svg>
            </span>
          </div>

          <header class="appbar">
            <button
              class="icon-btn"
              id="back-button"
              type="button"
              aria-label="Назад"
            >
              <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"></path></svg>
            </button>
            <div class="appbar-title" id="appbar-title">Тренажёр</div>
            <span></span>
          </header>

          <main class="content">
            <div class="progress-meta">
              <span id="progress-label">Задание 1 из 2</span
              ><span id="progress-topic">Тема</span>
            </div>
            <div class="progress-track">
              <div
                class="progress-value"
                id="progress-value"
                style="width: 50%"
              ></div>
            </div>

            <article class="task-card">
              <div class="task-kicker">
                <span id="task-topic"></span
                ><span class="task-diff" id="task-diff"></span>
              </div>
              <h1 id="task-title"></h1>
              <p class="task-statement" id="task-statement"></p>
            </article>

            <div class="answer-block">
              <label class="field-label" for="answer-input">Ваш ответ</label>
              <p class="answer-note">
                Отправьте свой вариант, чтобы открыть эталонный ответ и решение.
              </p>
              <div class="answer-row">
                <input
                  class="answer-input"
                  id="answer-input"
                  type="text"
                  placeholder="Введите ответ"
                  autocomplete="off"
                />
                <button class="check-btn" id="check-button" type="button">
                  Отправить
                </button>
              </div>
              <div class="feedback" id="feedback" hidden></div>
              <section class="solution-card" id="solution-card" hidden>
                <p class="solution-label">Эталонный ответ</p>
                <p id="reference-answer" class="reference-answer"></p>
                <p class="solution-label">Решение</p>
                <p id="reference-solution" class="hint-text"></p>
                <button class="mark-solved" id="mark-solved" type="button">
                  Отметить решённой
                </button>
              </section>
            </div>

            <div class="hint-block">
              <button class="hint-toggle" id="hint-toggle" type="button">
                Показать подсказку
              </button>
              <p class="hint-text" id="hint-text" hidden></p>
            </div>
          </main>

          <div class="bottom-action">
            <button class="btn-primary" id="next-button" type="button">
              Следующее задание
              <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
          </div>
          <div class="home-indicator" aria-hidden="true"></div>
          <olympiad-nav active="tasks"></olympiad-nav>
        </div>
      </div>
    </div>

    <script src="./max-init.js"></script>
    <script src="./olympiad-shell.js"></script>
    <script src="./math-render.js"></script>
    <script src="./answer-viewport.js"></script>
    <script src="./olympiad-task-solve.js"></script>
  </body>
</html>
