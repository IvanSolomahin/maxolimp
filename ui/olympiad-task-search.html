<!doctype html>
<html lang="ru"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Поиск олимпиадных задач</title>
    <script src="https://st.max.ru/js/max-web-app.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-warm: #eeeeee;
      --fg: #111111;
      --fg-2: #3a3a3a;
      --muted: #707070;
      --meta: #111111;
      --border: #d9d9d9;
      --border-soft: #eeeeee;
      --accent: #111111;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #168a46;
      --warn: #b7791f;
      --danger: #c53030;
      --font-display: Inter, system-ui, sans-serif;
      --font-body: Inter, system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 24px;
      --text-2xl: 36px;
      --text-3xl: 54px;
      --text-4xl: 76px;
      --leading-body: 1.52;
      --leading-tight: 1.06;
      --tracking-display: -0.025em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-12: 48px;
      --section-y-desktop: 96px;
      --section-y-tablet: 68px;
      --section-y-phone: 48px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      --elev-flat: none;
      --elev-ring: 0 0 0 1px var(--border);
      --elev-raised: 0 16px 40px rgba(0, 0, 0, 0.10);
      --focus-ring: 0 0 0 3px rgba(17, 17, 17, 0.18);
      --motion-fast: 150ms;
      --motion-base: 240ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
      --container-max: 1180px;
      --container-gutter-desktop: 36px;
      --container-gutter-tablet: 24px;
      --container-gutter-phone: 16px;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    button { color: inherit; }
    svg { display: block; }
    h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
    p { text-wrap: pretty; }
    [hidden] { display: none !important; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    :focus-visible {
      outline: 0;
      box-shadow: var(--focus-ring);
    }

    .container {
      width: min(100%, 760px);
      margin-inline: auto;
      padding-inline: var(--container-gutter-phone);
    }

    .topnav {
      position: sticky;
      inset-block-start: 0;
      z-index: 20;
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--border-soft);
      backdrop-filter: blur(16px);
    }

    .topnav-inner {
      min-height: 58px;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: var(--space-2);
    }

    .brand {
      overflow: hidden;
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: var(--tracking-display);
      text-align: center;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: var(--radius-pill);
      background: transparent;
      transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
    }

    .icon-btn:hover { border-color: var(--border); background: var(--surface); }
    .icon-btn:active { transform: translateY(1px); }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn[data-active="true"] { border-color: var(--border); background: var(--surface-warm); color: var(--fg); }
    .icon-btn[data-active="true"] svg { fill: currentColor; }

    .section { padding-block: var(--space-5) var(--section-y-phone); }

    .subject-switch {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .subject-label {
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subject-select {
      width: 100%;
      min-height: 48px;
      padding: 0 var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
    }

    .subject-select:hover { border-color: var(--fg-2); background: var(--bg); }
    .subject-select:focus-visible { border-color: var(--fg); outline: 0; box-shadow: var(--focus-ring); }

    .search-field {
      position: relative;
      border-radius: var(--radius-md);
      box-shadow: var(--elev-ring);
      background: var(--surface);
    }

    .search-field > svg {
      position: absolute;
      inset-inline-start: var(--space-4);
      inset-block-start: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      min-height: 54px;
      padding: 12px 50px 12px 46px;
      border: 0;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--fg);
      font-size: 16px;
    }

    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { outline: 0; box-shadow: var(--focus-ring); }
    .clear-search { position: absolute; inset-inline-end: 5px; inset-block-start: 5px; }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr);
      gap: var(--space-2);
      margin-top: var(--space-2);
      border-bottom: 1px solid var(--border-soft);
    }

    .control-btn,
    .sort-select {
      width: 100%;
      min-height: 44px;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--fg);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .control-btn {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: var(--space-2);
      padding-inline: var(--space-3);
      transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard);
    }

    .control-btn:hover { background: var(--surface); }
    .control-btn:active { background: var(--surface-warm); }
    .control-btn svg { width: 17px; height: 17px; }

    .count-badge {
      min-width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      padding-inline: var(--space-1);
      border-radius: var(--radius-pill);
      background: var(--fg);
      color: var(--surface);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
    }

    .sort-wrap { position: relative; border-inline-start: 1px solid var(--border-soft); }
    .sort-wrap svg {
      position: absolute;
      inset-inline-start: var(--space-3);
      inset-block-start: 50%;
      width: 17px;
      height: 17px;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .sort-select {
      appearance: none;
      padding: 0 32px 0 36px;
    }

    .sort-wrap::after {
      content: '';
      position: absolute;
      inset-inline-end: var(--space-3);
      inset-block-start: 50%;
      width: 7px;
      height: 7px;
      border-inline-end: 1.5px solid var(--fg);
      border-block-end: 1.5px solid var(--fg);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .active-filters {
      display: flex;
      gap: var(--space-2);
      overflow-x: auto;
      padding: var(--space-3) 0 2px;
      scrollbar-width: none;
    }

    .active-filters::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex: 0 0 auto;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg-2);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .filter-chip:hover { border-color: var(--fg-2); color: var(--fg); }
    .filter-chip:active { background: var(--surface-warm); }

    .results-head {
      display: flex;
      align-items: baseline;
      justify-content: flex-start;
      gap: var(--space-3);
      margin: var(--space-5) 0 var(--space-2);
    }

    .results-count {
      color: var(--muted);
      font-family: var(--font-body);
      font-size: var(--text-base);
      font-weight: 600;
      white-space: nowrap;
    }

    .task-list {
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .task-card {
      padding: var(--space-5) 0;
      background: var(--bg);
      transition: background var(--motion-fast) var(--ease-standard);
    }

    .task-card + .task-card { border-top: 1px solid var(--border-soft); }
    .task-card:hover { background: color-mix(in oklab, var(--surface) 58%, var(--bg)); }

    .task-top,
    .task-actions,
    .task-meta,
    .source-line {
      display: flex;
      align-items: center;
    }

    .task-top { justify-content: space-between; gap: var(--space-3); }
    .task-actions { flex: 0 0 auto; gap: 0; }
    .task-actions .icon-btn { color: var(--muted); }
    .task-actions .icon-btn:hover { color: var(--fg); }
    .task-number {
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      letter-spacing: 0;
    }
    .task-number:empty { display: none; }
    .difficulty-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 2px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg-2);
      font-size: var(--text-xs);
      font-weight: 600;
      white-space: nowrap;
    }

    .task-title {
      margin: var(--space-2) 0 var(--space-2);
      font-size: 20px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.012em;
    }

    .task-title a { color: inherit; text-decoration: none; }
    .task-title a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .task-title .text-btn { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
    .task-title .text-btn:hover { background: none; text-decoration: underline; text-underline-offset: 3px; }

    .task-fragment {
      display: -webkit-box;
      margin: 0;
      overflow: hidden;
      color: var(--fg-2);
      font-size: var(--text-base);
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .inline-math math { font-size: 1.05em; white-space: nowrap; }

    .task-description {
      margin: var(--space-2) 0 0;
      color: var(--muted);
      font-size: var(--text-sm);
      line-height: 1.45;
    }

    .task-meta {
      flex-wrap: wrap;
      gap: var(--space-4);
      margin-top: var(--space-2);
      color: var(--fg-2);
      font-size: var(--text-sm);
    }

    .meta-item { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; }
    .meta-item svg { width: 17px; height: 17px; }
    .difficulty-dot { width: 9px; height: 9px; border-radius: var(--radius-pill); }
    .difficulty-easy .difficulty-dot { background: var(--success); }
    .difficulty-medium .difficulty-dot { background: var(--warn); }
    .difficulty-hard .difficulty-dot { background: var(--danger); }

    .source-line {
      gap: var(--space-2);
      margin-top: var(--space-3);
      color: var(--muted);
      font-size: var(--text-sm);
      line-height: 1.45;
    }

    .source-line svg { flex: 0 0 auto; width: 18px; height: 18px; }

    .demo-note {
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
      margin: var(--space-4) 0 0;
      color: var(--muted);
      font-size: var(--text-sm);
    }

    .demo-note svg { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px; }

    .empty-state {
      padding: var(--space-12) var(--space-4);
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .empty-state h3 { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.01em; }
    .empty-state p { max-width: 36ch; margin: var(--space-2) auto var(--space-5); color: var(--muted); font-size: var(--text-base); }

    .text-btn {
      min-height: 44px;
      padding-inline: var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .text-btn:hover { border-color: var(--fg-2); background: var(--surface); }

    .task-page { min-height: calc(100dvh - 58px); padding-block: var(--space-6) var(--section-y-phone); }
    .task-page-inner { width: min(100%, 900px); margin-inline: auto; padding-inline: var(--container-gutter-phone); }
    .task-back { display: inline-flex; align-items: center; gap: var(--space-2); min-height: 44px; margin-bottom: var(--space-6); padding: 0; border: 0; background: none; color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
    .task-back:hover { color: var(--fg); }
    .task-page-meta { margin-bottom: var(--space-4); color: var(--muted); font-size: var(--text-sm); }
    .task-page-title { max-width: 24ch; margin-bottom: var(--space-8); font-size: clamp(30px, 5vw, 48px); line-height: 1.12; letter-spacing: var(--tracking-display); }
    .task-statement { max-width: 72ch; white-space: pre-wrap; font-size: clamp(18px, 2vw, 21px); line-height: 1.7; }
    .task-source { display: inline-flex; margin-top: var(--space-8); color: var(--fg); font-weight: 600; text-underline-offset: 4px; }
    .task-loading { color: var(--muted); }

    dialog {
      width: min(100% - 20px, 520px);
      height: min(88dvh, 720px);
      max-height: calc(100dvh - 20px);
      margin: auto auto 10px;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
      color: var(--fg);
      box-shadow: var(--elev-raised);
    }

    dialog[open] { display: flex; flex-direction: column; }

    dialog::backdrop { background: color-mix(in oklab, var(--fg) 42%, transparent); backdrop-filter: blur(3px); }

    .sheet-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border-soft);
    }

    .sheet-head h2 { font-size: var(--text-xl); font-weight: 600; letter-spacing: -0.01em; }
    .sheet-body {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 var(--space-4) var(--space-4);
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
    }
    .filter-group { padding: var(--space-4) 0; border-bottom: 1px solid var(--border-soft); }
    .filter-group:last-child { border-bottom: 0; }
    .filter-group h3 { margin-bottom: var(--space-3); font-family: var(--font-body); font-size: var(--text-base); font-weight: 600; letter-spacing: 0; }
    .choice-grid { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .choice { position: relative; }
    .choice input { position: absolute; opacity: 0; pointer-events: none; }
    .choice span {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      font-size: var(--text-sm);
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
    }

    .choice input:focus-visible + span { box-shadow: var(--focus-ring); }
    .choice input:checked + span { border-color: var(--fg); background: var(--fg); color: var(--surface); }
    .choice:hover span { border-color: var(--fg-2); }

    #filter-dialog .filter-selects { display: grid; gap: var(--space-3); }
    #filter-dialog .select-field { display: grid; gap: var(--space-2); }
    #filter-dialog .select-field > span { color: var(--muted); font-size: var(--text-sm); font-weight: 600; }
    #filter-dialog .filter-select {
      width: 100%;
      min-height: 48px;
      padding: 0 var(--space-4);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      color: var(--fg);
      font: 500 var(--text-base)/1 var(--font-body);
      letter-spacing: 0;
    }
    #filter-dialog .filter-select:hover { border-color: var(--fg-2); }
    #filter-dialog .filter-select:focus-visible { border-color: var(--fg); outline: 0; box-shadow: var(--focus-ring); }
    #filter-dialog .filter-select:disabled { background: var(--surface-warm); color: var(--muted); cursor: not-allowed; }
    .olympiad-picker { position: relative; display: grid; gap: var(--space-2); }
    .olympiad-options {
      position: absolute;
      inset: calc(100% + 5px) 0 auto;
      z-index: 15;
      max-height: min(300px, 42vh);
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      box-shadow: var(--elev-raised);
      overscroll-behavior: contain;
    }
    .olympiad-option {
      width: 100%;
      display: grid;
      gap: 2px;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid var(--border-soft);
      background: transparent;
      color: var(--fg);
      text-align: left;
      font-size: var(--text-sm);
      line-height: 1.35;
    }
    .olympiad-option:last-child { border-bottom: 0; }
    .olympiad-option:hover, .olympiad-option:focus-visible { background: var(--surface); }
    .olympiad-option strong { font-size: var(--text-sm); font-weight: 600; }
    .olympiad-option small { color: var(--muted); font-size: var(--text-xs); }
    .olympiad-empty { margin: 0; padding: 12px; color: var(--muted); font-size: var(--text-sm); }
    .olympiad-selection {
      width: fit-content;
      max-width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-2);
      min-height: 34px;
      padding: 3px 4px 3px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--surface);
      color: var(--fg-2);
      font-size: var(--text-sm);
      font-weight: 600;
    }
    .olympiad-selection-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .olympiad-selection-clear {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: var(--radius-pill);
      background: transparent;
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
    }
    .olympiad-selection-clear:hover { background: var(--surface-warm); color: var(--fg); }

    .sheet-actions {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-5) max(var(--space-3), env(safe-area-inset-bottom));
      border-top: 1px solid var(--border-soft);
      background: var(--surface);
    }

    .btn {
      min-height: 48px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
    }

    .btn:active { transform: translateY(1px); }
    .btn:disabled { cursor: not-allowed; opacity: 0.48; transform: none; }
    .btn-secondary { border-color: var(--border); background: transparent; color: var(--fg); }
    .btn-secondary:hover { border-color: var(--fg-2); background: var(--surface-warm); }
    .btn-primary { border-color: var(--accent); background: var(--accent); color: var(--accent-on); }
    .btn-primary:hover { border-color: var(--accent-hover); background: var(--accent-hover); color: var(--accent-on); }
    .btn-primary:active { border-color: var(--accent-active); background: var(--accent-active); color: var(--accent-on); }

    .toast {
      position: fixed;
      z-index: 50;
      inset-inline: var(--container-gutter-phone);
      inset-block-end: max(var(--space-5), env(safe-area-inset-bottom));
      width: min(calc(100% - var(--container-gutter-phone) * 2), 520px);
      margin-inline: auto;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      background: var(--fg);
      color: var(--surface);
      box-shadow: var(--elev-raised);
      font-size: var(--text-sm);
      text-align: center;
    }

    @media (min-width: 600px) {
      .container { padding-inline: var(--container-gutter-tablet); }
      .section { padding-block-start: var(--space-8); }
      .task-card { padding-block: var(--space-6); }
      dialog { margin: auto; }
      .task-page-inner { padding-inline: var(--container-gutter-tablet); }
    }

    @media (max-width: 390px) {
      .sort-select { padding-inline-end: 28px; }
      dialog { width: calc(100% - 12px); height: calc(100dvh - 12px); margin-block-end: 6px; }
      .sheet-head { padding-inline: var(--space-4); }
      .sheet-actions { padding-inline: var(--space-4); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="topnav" data-od-id="topnav">
    <div class="container topnav-inner">
      <a class="icon-btn" href="/olympiad-onboarding.html" aria-label="Подбор олимпиад" data-od-id="back-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m15 18-6-6 6-6"></path><path d="M9 12h10"></path></svg>
      </a>
      <h1 class="brand" data-od-id="site-title">Олимпиадные задачи</h1>
      <span aria-hidden="true"></span>
    </div>
  </header>

  <main id="content">
    <section class="section" data-od-id="task-search-screen">
      <div class="container">
        <label class="subject-switch" for="subject-select" data-od-id="subject-switch">
          <span class="subject-label">Предмет</span>
          <select class="subject-select" id="subject-select" aria-label="Выбранный предмет" data-od-id="subject-select">
            <option value="math">Математика</option>
            <option value="physics">Физика</option>
          </select>
        </label>

        <div class="search-field" data-od-id="search-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <label class="visually-hidden" for="task-query">Поиск по задачам</label>
          <input class="search-input" id="task-query" type="search" autocomplete="off" placeholder="Например, инвариант или закон Ома" data-od-id="search-input">
          <button class="icon-btn clear-search" type="button" aria-label="Очистить поиск" data-od-id="clear-search" hidden="">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
          </button>
        </div>

        <div class="toolbar" data-od-id="search-toolbar">
          <button class="control-btn" type="button" data-od-id="open-filters" aria-haspopup="dialog" aria-controls="filter-dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
            <span>Фильтры</span>
            <span class="count-badge" id="filter-count" hidden="">0</span>
          </button>
          <div class="sort-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 6h12M8 12h8M8 18h4M4 5v14"></path></svg>
            <label class="visually-hidden" for="sort-select">Сортировка</label>
            <select class="sort-select" id="sort-select" data-od-id="sort-select">
              <option value="relevance">По релевантности</option>
              <option value="newest">Сначала новые</option>
              <option value="difficulty">По сложности</option>
            </select>
          </div>
        </div>

        <div class="active-filters" id="active-filters" data-od-id="active-filters" aria-label="Активные фильтры" hidden=""></div>

        <div class="results-head">
          <h2 class="visually-hidden" id="results-heading" data-od-id="results-heading">Результаты</h2>
          <span class="results-count" id="results-count" aria-live="polite">0 заданий</span>
        </div>

        <div class="task-list" id="task-list" data-od-id="task-list" aria-labelledby="results-heading"></div>
        <button class="btn btn-secondary" id="load-more" type="button" hidden>Показать ещё</button>
        <div class="empty-state" id="empty-state" data-od-id="empty-state" role="status" hidden="">
          <h3 id="empty-title">Ничего не найдено</h3>
          <p id="empty-copy">Попробуйте другой запрос или уберите часть фильтров.</p>
          <button class="text-btn" id="empty-action" type="button" data-od-id="reset-search">Сбросить поиск</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="filter-dialog" aria-labelledby="filter-title" data-od-id="filter-dialog">
    <div class="sheet-head">
      <h2 id="filter-title">Фильтры</h2>
      <button class="icon-btn" type="button" aria-label="Закрыть фильтры" data-od-id="close-filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"></path></svg>
      </button>
    </div>
    <div class="sheet-body">
      <div class="filter-group">
        <h3>Олимпиада</h3>
        <div class="olympiad-picker">
          <input class="filter-select" id="olympiad-search" type="search" autocomplete="off" placeholder="Поиск по названию" role="combobox" aria-autocomplete="list" aria-controls="olympiad-options" aria-expanded="false">
          <div class="olympiad-options" id="olympiad-options" role="listbox" aria-label="Олимпиады" hidden></div>
          <div class="olympiad-selection" id="olympiad-selection" hidden>
            <span class="olympiad-selection-name" id="olympiad-selection-name"></span>
            <button class="olympiad-selection-clear" id="clear-olympiad" type="button" aria-label="Убрать выбранную олимпиаду">×</button>
          </div>
        </div>
      </div>
      <div class="filter-group">
        <h3>Сложность</h3>
        <div class="filter-selects">
          <label class="select-field" for="difficulty-min"><span>От</span><input class="filter-select" id="difficulty-min" type="number" min="1" max="10" placeholder="1"></label>
          <label class="select-field" for="difficulty-max"><span>До</span><input class="filter-select" id="difficulty-max" type="number" min="1" max="10" placeholder="10"></label>
        </div>
      </div>
      <div class="filter-group">
        <h3>Класс</h3>
        <select class="filter-select" id="grade-filter"><option value="">Все классы</option><option value="8">8 класс</option><option value="9">9 класс</option><option value="10">10 класс</option><option value="11">11 класс</option></select>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-secondary" type="button" data-od-id="reset-filters">Сбросить</button>
      <button class="btn btn-primary" type="button" data-od-id="apply-filters">Показать задачи</button>
    </div>
  </dialog>

  <main class="task-page" id="task-page" hidden>
    <div class="task-page-inner">
      <button class="task-back" type="button" id="task-back"><span aria-hidden="true">←</span> К результатам поиска</button>
      <p class="task-page-meta" id="detail-meta"></p>
      <h1 class="task-page-title" id="detail-title">Загрузка задачи…</h1>
      <p class="task-statement task-loading" id="detail-statement" aria-live="polite"></p>
      <a class="task-source" id="detail-source" target="_blank" rel="noopener noreferrer" hidden>Открыть источник</a>
    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden=""></div>

  <script src="/max-init.js"></script>

  <script src="/math-render.js" defer></script>
  <script src="/task-search.js" defer></script>


</body></html>
