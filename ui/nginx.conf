# 1. Автоматический редирект с HTTP на HTTPS
server {
    listen 80;
    server_name gazprompt.duckdns.org;

    return 301 https://$host$request_uri;
}

# 2. Основной HTTPS сервер
server {
    listen 443 ssl;
    server_name gazprompt.duckdns.org;

    client_max_body_size 20M;

    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/gazprompt.duckdns.org.key;

    # Настройки безопасности SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index olympiad-home.html;

    add_header Cache-Control "no-store" always;

    location = / {
        try_files /olympiad-home.html =404;
    }

    location /webhook {
        proxy_pass http://task-app:8000/webhook;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/max/ {
        proxy_pass http://task-app:8000/api/max/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/auth/ {
        proxy_pass http://task-app:8000/api/auth/;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/progress/ {
        rewrite ^/api/progress(/.*)$ /progress$1 break;

        proxy_pass http://task-app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/tasks/[^/]+/?$ {
        try_files /olympiad-task-search.html =404;
    }

    location /api/tasks/ {
        rewrite ^/api/tasks(/.*)$ $1 break;

        proxy_pass http://task-app:8000;

        add_header X-Debug-URI $uri always;
        add_header X-Debug-Request-URI $request_uri always;
    }

    location ^~ /api/olympiads/ {
        rewrite ^/api/olympiads(/.*)$ $1 break;

        proxy_pass http://olymp-app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location /tasks-docs {
        proxy_pass http://task-app:8000/tasks-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tasks-openapi.json {
        proxy_pass http://task-app:8000/tasks-openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tasks-redoc {
        proxy_pass http://task-app:8000/tasks-redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /olymp-docs {
        proxy_pass http://olymp-app:8000/olymp-docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /olymp-openapi.json {
        proxy_pass http://olymp-app:8000/olymp-openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /olymp-redoc {
        proxy_pass http://olymp-app:8000/olymp-redoc;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri =404;
    }
}