<!DOCTYPE html>
<html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Мои олимпиады</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f7f7f7;
      --surface-warm: #eeeeee;
      --fg: #111111;
      --fg-2: #3a3a3a;
      --muted: #707070;
      --border: #d9d9d9;
      --border-soft: #eeeeee;
      --accent: #111111;
      --accent-on: #ffffff;
      --accent-hover: color-mix(in oklab, var(--accent), black 8%);
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --font-display: Inter, system-ui, sans-serif;
      --font-body: Inter, system-ui, sans-serif;
      --font-mono: "SF Mono", ui-monospace, Menlo, monospace;
      --text-xs: 12px;
      --text-sm: 14px;
      --text-base: 16px;
      --text-lg: 18px;
      --text-xl: 24px;
      --leading-body: 1.52;
      --tracking-display: -0.025em;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-pill: 9999px;
      --elev-raised: 0 16px 40px rgba(0, 0, 0, 0.10);
      --focus-ring: 0 0 0 3px rgba(17, 17, 17, 0.18);
      --motion-fast: 150ms;
      --motion-base: 240ms;
      --ease-standard: cubic-bezier(0.2, 0, 0, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    html { color-scheme: light; -webkit-text-size-adjust: 100%; }
    body {
      min-width: 320px;
      display: grid;
      place-items: center;
      padding: 28px;
      background: var(--surface);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: var(--leading-body);
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; cursor: pointer; }
    svg { display: block; flex: 0 0 auto; }
    h1, h2, p { margin: 0; }
    h1, h2 { font-family: var(--font-display); text-wrap: balance; }
    p { text-wrap: pretty; }
    a { color: inherit; }
    :focus-visible { outline: 0; box-shadow: var(--focus-ring); }

    .stage { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
    .caption { color: var(--muted); font: var(--text-xs) var(--font-mono); letter-spacing: .08em; text-transform: uppercase; }
    .caption strong { color: var(--fg); font-weight: 600; }
    .device {
      position: relative;
      width: 390px;
      height: 844px;
      padding: 10px;
      border-radius: 54px;
      background: linear-gradient(160deg, color-mix(in oklab, var(--fg), var(--bg) 18%), var(--fg));
      box-shadow: var(--elev-raised);
      isolation: isolate;
    }
    .device::before, .device::after { content: ''; position: absolute; top: 108px; bottom: 108px; width: 3px; background: color-mix(in oklab, var(--fg), var(--bg) 22%); }
    .device::before { left: -2px; }
    .device::after { right: -2px; }
    .island { position: absolute; top: 20px; left: 50%; z-index: 30; width: 120px; height: 34px; transform: translateX(-50%); border-radius: var(--radius-pill); background: var(--fg); }
    .screen { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 44px; background: var(--bg); }
    .statusbar { flex: 0 0 47px; display: flex; align-items: flex-start; justify-content: space-between; padding: 17px 24px 0; font-size: 15px; font-weight: 650; }
    .statusbar-right { display: inline-flex; align-items: center; gap: 6px; }
    .statusbar svg { width: 17px; height: 11px; fill: var(--fg); }
    .statusbar .battery { width: 25px; }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    .appbar { flex: 0 0 56px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--border-soft); background: color-mix(in oklab, var(--bg) 94%, transparent); backdrop-filter: blur(16px); }
    .appbar-title { text-align: center; font-size: var(--text-sm); font-weight: 650; }
    .content { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: var(--space-5); -webkit-overflow-scrolling: touch; }
    .content::-webkit-scrollbar { display: none; }

    .intro { padding: var(--space-6) 0 var(--space-5); }
    .intro h1 { font-size: 31px; line-height: 1.08; letter-spacing: var(--tracking-display); }
    .intro p { max-width: 31ch; margin-top: var(--space-3); color: var(--muted); }

    .section-label { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: var(--space-3); }
    .section-label h2 { font-size: var(--text-base); }
    .section-label a { color: var(--muted); font-size: var(--text-sm); text-decoration: none; }
    .section-label a:hover { color: var(--fg); }

    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin-bottom: var(--space-6); }
    .quick-card { display: block; padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg); text-decoration: none; transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard); }
    .quick-card:hover { border-color: var(--fg-2); background: var(--surface); }
    .quick-card svg { width: 22px; height: 22px; margin-bottom: var(--space-3); stroke: var(--fg); fill: none; stroke-width: 1.6; }
    .quick-card strong { display: block; font-size: var(--text-sm); font-weight: 650; }
    .quick-card span { display: block; margin-top: 2px; color: var(--muted); font-size: var(--text-xs); line-height: 1.4; }

    .cards { display: grid; gap: var(--space-3); margin-bottom: var(--space-6); }
    .olympiad-card { overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--bg); }
    .card-head { display: grid; grid-template-columns: 1fr 44px; gap: var(--space-2); padding: var(--space-4) var(--space-4) var(--space-3); }
    .card-kicker { color: var(--muted); font: var(--text-xs) var(--font-mono); }
    .card-head h2 { margin-top: var(--space-1); font-size: var(--text-lg); line-height: 1.25; letter-spacing: -.01em; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: var(--radius-pill); background: transparent; }
    .icon-btn:hover { background: var(--surface); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .card-facts { padding: 0 var(--space-4); }
    .fact-row { display: grid; grid-template-columns: 88px 1fr; align-items: start; gap: var(--space-2); padding: 10px 0; border-top: 1px solid var(--border-soft); font-size: var(--text-sm); }
    .fact-label { color: var(--muted); }
    .fact-value { min-width: 0; font-weight: 650; }
    .progress-track { height: 6px; overflow: hidden; border-radius: var(--radius-pill); background: var(--border-soft); }
    .progress-value { height: 100%; background: var(--fg); }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border-soft); background: var(--surface); }
    .card-foot p { color: var(--muted); font-size: var(--text-xs); }
    .go-btn { min-height: 44px; flex: 0 0 auto; border: 0; background: transparent; font-size: var(--text-sm); font-weight: 650; text-decoration: none; color: var(--fg); }
    .go-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
    .empty-state { padding: var(--space-6) var(--space-4); color: var(--muted); text-align: center; border: 1px dashed var(--border); border-radius: var(--radius-lg); font-size: var(--text-sm); }

    .tabbar { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 8px 0; border-top: 1px solid var(--border-soft); background: color-mix(in oklab, var(--bg) 94%, transparent); backdrop-filter: blur(18px); }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0 8px; border: 0; background: transparent; color: var(--muted); font-size: 11px; font-weight: 650; text-decoration: none; }
    .tab-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
    .tab-item.active { color: var(--fg); }
    .tab-item.active svg { fill: color-mix(in oklab, var(--fg), transparent 85%); }
    .home-indicator { flex: 0 0 28px; position: relative; }
    .home-indicator::after { content: ''; position: absolute; left: 50%; bottom: 8px; width: 134px; height: 5px; transform: translateX(-50%); border-radius: var(--radius-pill); background: var(--fg); opacity: .88; }

    @media (max-width: 430px) {
      body { display: block; padding: 0; background: var(--bg); }
      .stage { display: block; }
      .caption { display: none; }
      .device { width: 100vw; height: 100dvh; padding: 0; border-radius: 0; background: var(--bg); box-shadow: none; }
      .device::before, .device::after { display: none; }
      .screen { border-radius: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="stage">
    <div class="caption"><strong>Олимпиады</strong> · главная</div>
    <div class="device">
      <span class="island" aria-hidden="true"></span>
      <div class="screen">
        <div class="statusbar">
          <span class="num">9:41</span>
          <span class="statusbar-right">
            <svg viewBox="0 0 17 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4" rx=".6"></rect><rect x="4" y="5" width="3" height="6" rx=".6"></rect><rect x="8" y="3" width="3" height="8" rx=".6"></rect><rect x="12" y="0" width="3" height="11" rx=".6"></rect></svg>
            <svg viewBox="0 0 17 11" aria-hidden="true"><path d="M8.5 1.5c-3 0-5.8 1.1-8 3.1L2 6.1a9.8 9.8 0 0 1 13 0l1.5-1.5a11.8 11.8 0 0 0-8-3.1ZM3.5 7.6 5 9.1a5.2 5.2 0 0 1 7 0l1.5-1.5a7.4 7.4 0 0 0-10 0Zm3 3 2 2 2-2a2.8 2.8 0 0 0-4 0Z"></path></svg>
            <svg class="battery" viewBox="0 0 25 11" aria-hidden="true"><rect x=".5" y=".5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity=".45"></rect><rect x="22" y="3.5" width="1.5" height="4" rx=".4"></rect><rect x="2" y="2" width="18" height="7" rx="1.4"></rect></svg>
          </span>
        </div>

        <header class="appbar">
          <span></span>
          <div class="appbar-title">Мои олимпиады</div>
          <span></span>
        </header>

        <main class="content">
          <div class="intro">
            <h1>С возвращением</h1>
            <p>Следите за прогрессом по олимпиадам и быстро переходите к подбору или заданиям.</p>
          </div>

          <div class="quick-actions">
            <a class="quick-card" href="./Подбор олимпиад для поступления.html">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <strong>Подобрать олимпиаду</strong>
              <span>По вузу и направлению</span>
            </a>
            <a class="quick-card" href="./olympiad-task-search.html">
              <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"></path><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>
              <strong>Искать задания</strong>
              <span>По темам олимпиады</span>
            </a>
          </div>

          <div class="section-label">
            <h2>Отслеживаемые олимпиады</h2>
            <a href="./Подбор олимпиад для поступления.html">Добавить</a>
          </div>
          <div class="cards" id="tracked-list"></div>
        </main>

        <nav class="tabbar" aria-label="Разделы">
          <a class="tab-item active" href="./olympiad-home.html">
            <svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg>
            Главная
          </a>
          <a class="tab-item" href="./Подбор олимпиад для поступления.html">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
            Олимпиады
          </a>
          <a class="tab-item" href="./olympiad-task-search.html">
            <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"></path><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"></path></svg>
            Задания
          </a>
          <a class="tab-item" href="./olympiad-community.html">
            <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M2.5 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5"></path><path d="M14.5 14.3c2.1.2 3.9 1.8 4.4 4.7"></path></svg>
            Сообщества
          </a>
        </nav>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
    const TRACKED = [
      { subject: 'Информатика', name: 'Высшая проба', benefit: 'БВИ', total: 200, done: 46 },
      { subject: 'Математика', name: 'Физтех', benefit: '100 баллов', total: 150, done: 12 },
    ];

    const list = document.getElementById('tracked-list');

    if (TRACKED.length === 0) {
      list.innerHTML = '<p class="empty-state">Пока нет олимпиад в отслеживании — подберите первую.</p>';
    } else {
      list.innerHTML = TRACKED.map(o => {
        const pct = Math.round((o.done / o.total) * 100);
        return `
        <article class="olympiad-card">
          <div class="card-head">
            <div><p class="card-kicker">${o.subject}</p><h2>${o.name}</h2></div>
            <button class="icon-btn" type="button" aria-label="Убрать из отслеживаемых">✕</button>
          </div>
          <div class="card-facts">
            <div class="fact-row"><span class="fact-label">Льгота</span><span class="fact-value">${o.benefit}</span></div>
            <div class="fact-row"><span class="fact-label">Прогресс</span>
              <span class="fact-value">
                ${o.done} из ${o.total} заданий
                <div class="progress-track" style="margin-top:6px"><div class="progress-value" style="width:${pct}%"></div></div>
              </span>
            </div>
          </div>
          <div class="card-foot">
            <p>${pct}% тем закрыто</p>
            <a class="go-btn" href="./olympiad-task-solve.html">К заданиям →</a>
          </div>
        </article>`;
      }).join('');
    }
  </script>
</body></html>
