name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      audit_fields:
        description: Count values in candidate database fields (read only)
        type: boolean
        default: false

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Update Docker Compose on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AUDIT_FIELDS: ${{ inputs.audit_fields || false }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?SSH_HOST is required}"
          : "${SSH_USER:?SSH_USER is required}"
          : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY is required}"
          : "${SSH_KNOWN_HOSTS:?SSH_KNOWN_HOSTS is required}"
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          ssh_port="${SSH_PORT:-22}"
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          encoded_path="$(printf '%s' "$DEPLOY_PATH" | base64 -w 0)"
          ssh -T -i "$ssh_dir/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -p "$ssh_port" \
            -- "$SSH_USER@$SSH_HOST" bash -s -- "$encoded_path" "$AUDIT_FIELDS" <<'REMOTE'
          set -euo pipefail
          deploy_path="$(printf '%s' "$1" | base64 --decode)"
          cd "$deploy_path"
          test "$(git branch --show-current)" = main
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git merge --abort
          fi
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git status --short
            echo "Deployment checkout has tracked changes; refusing to overwrite them" >&2
            exit 1
          fi
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/images/*) ;;
              *) echo "Unexpected untracked file: $path" >&2; exit 1 ;;
            esac
          done < <(git ls-files --others --exclude-standard -z)
          previous_commit="$(git rev-parse HEAD)"
          git fetch origin main
          git merge --no-edit -X theirs origin/main
          current_commit="$(git rev-parse HEAD)"
          bash scripts/deploy.sh "$previous_commit" "$current_commit"
          if [[ "${2:-false}" == true ]]; then
            docker compose exec -T task-db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' <<'SQL'
          BEGIN READ ONLY;
          SELECT 'solutions.author' AS field, count(*) FILTER (WHERE author IS NOT NULL) AS populated FROM solutions
          UNION ALL SELECT 'solution_methods.embedding metadata', count(*) FILTER (WHERE embedding IS NOT NULL OR embedding_model IS NOT NULL OR embedding_model_version IS NOT NULL) FROM solution_methods
          UNION ALL SELECT 'topics.embedding metadata', count(*) FILTER (WHERE embedding IS NOT NULL OR embedding_model IS NOT NULL OR embedding_model_version IS NOT NULL) FROM topics
          UNION ALL SELECT 'olympiads.embedding metadata', count(*) FILTER (WHERE embedding IS NOT NULL OR embedding_model IS NOT NULL OR embedding_model_version IS NOT NULL) FROM olympiads
          UNION ALL SELECT 'task_topics.weight <> 1', count(*) FILTER (WHERE weight <> 1.0) FROM task_topics
          UNION ALL SELECT 'task_sources.scraped_at', count(*) FILTER (WHERE scraped_at IS NOT NULL) FROM task_sources;
          COMMIT;
          SQL
          fi
          REMOTE
