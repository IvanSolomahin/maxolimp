services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gazprompt
      POSTGRES_PASSWORD: gazprompt
      POSTGRES_DB: gazprompt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazprompt -d gazprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gazprompt:gazprompt@db:5432/gazprompt
      EMBEDDING_MODEL: qwen/qwen3-embedding-4b
      EMBEDDING_DIMENSION: "2560"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
