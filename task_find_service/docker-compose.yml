networks:
  gazprompt:
    driver: bridge

services:
  task-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gazprompt
      POSTGRES_PASSWORD: gazprompt
      POSTGRES_DB: gazprompt
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - gazprompt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gazprompt -d gazprompt"]
      interval: 5s
      timeout: 5s
      retries: 10

  task-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gazprompt:gazprompt@task-db:5432/gazprompt
      EMBEDDING_MODEL: intfloat/multilingual-e5-large
      EMBEDDING_MODEL_VERSION: "1.0"
      EMBEDDING_DIMENSION: "1024"
      OLYMP_FIND_SERVICE_URL: http://olymp-app:8000
    depends_on:
      task-db:
        condition: service_healthy
    networks:
      - gazprompt

  olymp-db:
    image: postgres:16
    environment:
      POSTGRES_USER: olymp
      POSTGRES_PASSWORD: olymp
      POSTGRES_DB: olymp
    volumes:
      - olymp-pgdata:/var/lib/postgresql/data
      - ../olymp_find_service/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    networks:
      - gazprompt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olymp -d olymp"]
      interval: 5s
      timeout: 5s
      retries: 10

  olymp-app:
    build:
      context: ../olymp_find_service
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://olymp:olymp@olymp-db:5432/olymp
      TASK_FIND_SERVICE_URL: http://task-app:8000
      DEFAULT_USER_ID: "1"
    depends_on:
      olymp-db:
        condition: service_healthy
    networks:
      - gazprompt

volumes:
  pgdata:
  olymp-pgdata:
